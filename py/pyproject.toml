[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sinistra"
version = "0.1.0"
description = "Python bindings for the sinistra drift-diffusion model simulator"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Snehasish Satpathy", email = "snehasish.satpathy01@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # rust-numpy needs the numpy Python package importable at runtime, and the
    # API returns / accepts np.ndarray.
    "numpy>=1.21",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "sinistra._sinistra"
python-source = "python"
# Build the extension module against the Python limited API (abi3).
features = ["pyo3/extension-module"]
