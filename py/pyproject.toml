[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sinistra"
version = "0.1.0"
description = "Fast drift-diffusion model (DDM) simulation and parameter recovery, powered by a Rust core"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Snehasish Satpathy", email = "snehasish.satpathy01@gmail.com" },
]
keywords = ["drift-diffusion", "ddm", "cognitive-science", "reaction-time", "psychology", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # rust-numpy needs the numpy Python package importable at runtime, and the
    # API returns / accepts np.ndarray.
    "numpy>=1.21",
]

[project.urls]
Repository = "https://github.com/snehasish01/sinistra"
Documentation = "https://github.com/snehasish01/sinistra#readme"
Issues = "https://github.com/snehasish01/sinistra/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.6"]

[tool.maturin]
module-name = "sinistra._sinistra"
python-source = "python"
# Build the extension module against the Python limited API (abi3).
features = ["pyo3/extension-module"]
