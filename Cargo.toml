[workspace]
resolver = "2"
members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Snehasish Satpathy <snehasish.satpathy01@gmail.com>"]
repository = "https://github.com/snehasish-satpathy/sinistra"

[workspace.dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1"

# The test suite runs Monte-Carlo simulations (DDM property checks, parameter
# recovery) with millions of trials; an unoptimized build makes `cargo test`
# take minutes. Optimize test binaries while keeping debug assertions on.
[profile.test]
opt-level = 3
