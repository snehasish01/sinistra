[package]
name = "sinistra-core"
description = "Drift-diffusion model (DDM) simulator with EZ-diffusion and simulation-based parameter recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sinistra-core"
readme = "README.md"
keywords = ["drift-diffusion", "ddm", "cognitive-science", "simulation", "reaction-time"]
categories = ["science::neuroscience", "simulation", "mathematics"]

[lib]
name = "sinistra_core"
path = "src/lib.rs"

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
rayon.workspace = true
argmin = { version = "0.10", default-features = false }
argmin-math = { version = "0.4", features = ["vec"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "simulate"
harness = false
